[project]
name = "evision-backend"
version = "0.1.0"
description = "Backend API for EVision Telangana"

requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "geopandas>=1.1.4",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyogrio>=0.13.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.4",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
    "joblib>=1.4.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
